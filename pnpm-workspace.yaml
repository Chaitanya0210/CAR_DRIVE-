packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

overrides:
  body-parser: '>=1.20.3'
  send: '>=0.19.0'
  serve-static: '>=1.16.0'
  express: '>=4.21.2'
  cookie: '>=0.7.2'
  path-to-regexp: '>=0.1.12'

