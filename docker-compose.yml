version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: groupdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: groupdrive
      POSTGRES_PASSWORD: groupdrive_secret
      POSTGRES_DB: groupdrive_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U groupdrive -d groupdrive_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: groupdrive-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
